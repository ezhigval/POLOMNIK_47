# Deploy to the Selectel production VPS after green CI on main (one at a time).
# Secret: DEPLOY_SSH_KEY (dedicated private key for the VPS deploy user).
name: Deploy production

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [[ -z "${DEPLOY_SSH_KEY}" ]]; then
            echo "DEPLOY_SSH_KEY secret is not set."
            exit 1
          fi

      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Install pinned VPS host key
        run: |
          mkdir -p ~/.ssh
          cp deploy/vps/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Selectel VPS
        env:
          VPS_SSH_HOST: deploy@92.53.100.23
          VPS_DEPLOY_DIR: /opt/polomnik
          VPS_ENV_FILE: .env.production.test
        run: |
          chmod +x deploy/vps/deploy.sh
          KNOWN_HOSTS="$HOME/.ssh/known_hosts" SSH_KEY="$HOME/.ssh/deploy_key" ./deploy/vps/deploy.sh

      - name: Wait for API ready
        run: |
          ok=0
          for _ in $(seq 1 36); do
            if curl -sf --max-time 15 --resolve api.tikhvin-palomnik.ru:443:92.53.100.23 https://api.tikhvin-palomnik.ru/health/ready >/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          if [[ "$ok" != "1" ]]; then
            echo "health/ready did not return 200 in time"
            exit 1
          fi
          curl -sf --resolve api.tikhvin-palomnik.ru:443:92.53.100.23 https://api.tikhvin-palomnik.ru/health/ready
