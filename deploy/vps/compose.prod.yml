# Selectel VPS production overrides. Keep the database in its dedicated
# persistent volume across code deployments.
services:
  api:
    env_file:
      - path: .env.mail
        required: false
    environment:
      MAIL_ADAPTER: smtp
      SMTP_HOST: smtp.mail.selcloud.ru
      SMTP_PORT: '1126'
      SMTP_FROM: info@tikhvin-palomnik.ru
  worker:
    env_file:
      - path: .env.mail
        required: false
    environment:
      MAIL_ADAPTER: smtp
      SMTP_HOST: smtp.mail.selcloud.ru
      SMTP_PORT: '1126'
      SMTP_FROM: info@tikhvin-palomnik.ru
  mail:
    build:
      context: ./deploy/vps/mail
    env_file:
      - path: .env.mail
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "25:25"
    volumes:
      - mail_queue:/var/spool/postfix
      - caddy_data:/caddy_data:ro
    restart: unless-stopped

volumes:
  postgres_data:
    name: polomnik_postgres_vps_data
  mail_queue:
    name: polomnik_mail_queue
