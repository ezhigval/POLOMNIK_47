services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-palomnik}
      POSTGRES_USER: ${POSTGRES_USER:-palomnik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-palomnik}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-palomnik} -d ${POSTGRES_DB:-palomnik}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.goose
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
    command:
      - -dir
      - /migrations
      - postgres
      - postgres://${POSTGRES_USER:-palomnik}:${POSTGRES_PASSWORD:-palomnik}@postgres:5432/${POSTGRES_DB:-palomnik}?sslmode=disable
      - up

  seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/seeds/dev.sql:/seed.sql:ro
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "psql postgres://${POSTGRES_USER:-palomnik}:${POSTGRES_PASSWORD:-palomnik}@postgres:5432/${POSTGRES_DB:-palomnik}?sslmode=disable -f /seed.sql || true",
      ]

  api:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-palomnik}:${POSTGRES_PASSWORD:-palomnik}@postgres:5432/${POSTGRES_DB:-palomnik}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: dev-admin-token
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-api-secret}
      NOTIFICATION_ADAPTER: ${NOTIFICATION_ADAPTER:-noop}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_LOGIN_BOT_TOKEN: ${TELEGRAM_LOGIN_BOT_TOKEN:-}
      TELEGRAM_LOGIN_BOT_USERNAME: ${TELEGRAM_LOGIN_BOT_USERNAME:-}
      PHONE_ADAPTER: ${PHONE_ADAPTER:-noop}
      SMS_ADAPTER: ${SMS_ADAPTER:-}
      SMSRU_API_ID: ${SMSRU_API_ID:-}
      MAIL_ADAPTER: ${MAIL_ADAPTER:-noop}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_FORWARD_TO: ${MAIL_FORWARD_TO:-}
      YANDEX_OAUTH_CLIENT_ID: ${YANDEX_OAUTH_CLIENT_ID:-}
      YANDEX_OAUTH_CLIENT_SECRET: ${YANDEX_OAUTH_CLIENT_SECRET:-}
      VK_OAUTH_CLIENT_ID: ${VK_OAUTH_CLIENT_ID:-}
      VK_OAUTH_CLIENT_SECRET: ${VK_OAUTH_CLIENT_SECRET:-}
      MAX_OAUTH_CLIENT_ID: ${MAX_OAUTH_CLIENT_ID:-}
      MAX_OAUTH_CLIENT_SECRET: ${MAX_OAUTH_CLIENT_SECRET:-}
      MANAGEMENT_BASE_URL: ${MANAGEMENT_BASE_URL:-http://localhost:3000/management/bookings}
      CRM_ADAPTER: ${CRM_ADAPTER:-noop}
      ACCOUNTING_ADAPTER: ${ACCOUNTING_ADAPTER:-noop}
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
      ONEC_BASE_URL: ${ONEC_BASE_URL:-}
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      UPLOAD_DIR: /data/uploads
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL:-http://localhost:8080}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      CAPTCHA_ADAPTER: ${CAPTCHA_ADAPTER:-noop}
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
      SMARTCAPTCHA_CLIENT_KEY: ${SMARTCAPTCHA_CLIENT_KEY:-}
      BACKUP_STORAGE_ADAPTER: ${BACKUP_STORAGE_ADAPTER:-noop}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://storage.yandexcloud.net}
      S3_REGION: ${S3_REGION:-ru-central1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-palomnik-backups}
      BACKUP_LAST_PATH: ${BACKUP_LAST_PATH:-/tmp/palomnik-last-backup.json}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8080/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      ADMIN_TOKEN: dev-admin-token
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-api-secret}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://${POSTGRES_USER:-palomnik}:${POSTGRES_PASSWORD:-palomnik}@postgres:5432/${POSTGRES_DB:-palomnik}?sslmode=disable
      LOG_LEVEL: info
      CRM_ADAPTER: ${CRM_ADAPTER:-noop}
      ACCOUNTING_ADAPTER: ${ACCOUNTING_ADAPTER:-noop}
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
      ONEC_BASE_URL: ${ONEC_BASE_URL:-}
      OUTBOX_WORKER_POLL_INTERVAL: ${OUTBOX_WORKER_POLL_INTERVAL:-30s}
      OUTBOX_WORKER_BATCH_SIZE: ${OUTBOX_WORKER_BATCH_SIZE:-10}
      OUTBOX_WORKER_MAX_ATTEMPTS: ${OUTBOX_WORKER_MAX_ATTEMPTS:-5}
      WORKER_HEARTBEAT_PATH: /tmp/palomnik-worker-heartbeat
      WORKER_HEARTBEAT_MAX_AGE: ${WORKER_HEARTBEAT_MAX_AGE:-2m}
      NOTIFICATION_ADAPTER: ${NOTIFICATION_ADAPTER:-noop}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      MANAGEMENT_BASE_URL: ${MANAGEMENT_BASE_URL:-http://localhost:3000/management/bookings}
    entrypoint: ["/app/palomnik-worker"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/palomnik-worker-heartbeat && test $$(($$(date +%s) - $$(stat -c %Y /tmp/palomnik-worker-heartbeat))) -lt 120",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
