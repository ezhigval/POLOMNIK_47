# Production overlay. Usage:
#   cp .env.production.example .env.production
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires DNS for SITE_DOMAIN and API_DOMAIN pointing to the server.

services:
  postgres:
    ports: !override []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-palomnik}
      POSTGRES_USER: ${POSTGRES_USER:-palomnik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped

  redis:
    ports: !override []
    restart: unless-stopped

  seed:
    # Keep the service defined (api/worker depend on it) but do not load dev data.
    profiles: !override []
    entrypoint: ["true"]
    command: []

  migrate:
    command:
      - -dir
      - /migrations
      - postgres
      - postgres://${POSTGRES_USER:-palomnik}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-palomnik}?sslmode=disable
      - up

  api:
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-palomnik}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-palomnik}?sslmode=disable
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      BITRIX_INBOUND_TOKEN: ${BITRIX_INBOUND_TOKEN:-}
      UPLOAD_DIR: /data/uploads
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      NOTIFICATION_ADAPTER: ${NOTIFICATION_ADAPTER:-noop}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-https://api.tikhvin-palomnik.ru/api/v1/webhooks/telegram}
      TELEGRAM_LOGIN_BOT_TOKEN: ${TELEGRAM_LOGIN_BOT_TOKEN:-}
      TELEGRAM_LOGIN_BOT_USERNAME: ${TELEGRAM_LOGIN_BOT_USERNAME:-}
      PHONE_ADAPTER: ${PHONE_ADAPTER:-noop}
      SMS_ADAPTER: ${SMS_ADAPTER:-}
      SMSRU_API_ID: ${SMSRU_API_ID:-}
      MAIL_ADAPTER: ${MAIL_ADAPTER:-noop}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_FORWARD_TO: ${MAIL_FORWARD_TO:-}
      YANDEX_OAUTH_CLIENT_ID: ${YANDEX_OAUTH_CLIENT_ID:-}
      YANDEX_OAUTH_CLIENT_SECRET: ${YANDEX_OAUTH_CLIENT_SECRET:-}
      VK_OAUTH_CLIENT_ID: ${VK_OAUTH_CLIENT_ID:-}
      VK_OAUTH_CLIENT_SECRET: ${VK_OAUTH_CLIENT_SECRET:-}
      MAX_OAUTH_CLIENT_ID: ${MAX_OAUTH_CLIENT_ID:-}
      MAX_OAUTH_CLIENT_SECRET: ${MAX_OAUTH_CLIENT_SECRET:-}
      MAX_OAUTH_AUTHORIZE_URL: ${MAX_OAUTH_AUTHORIZE_URL:-}
      MAX_OAUTH_TOKEN_URL: ${MAX_OAUTH_TOKEN_URL:-}
      MAX_OAUTH_USERINFO_URL: ${MAX_OAUTH_USERINFO_URL:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://tikhvin-palomnik.ru}
      MANAGEMENT_BASE_URL: ${MANAGEMENT_BASE_URL:-https://tikhvin-palomnik.ru/management/bookings}
      CAPTCHA_ADAPTER: ${CAPTCHA_ADAPTER:-noop}
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
      SMARTCAPTCHA_CLIENT_KEY: ${SMARTCAPTCHA_CLIENT_KEY:-}
      BACKUP_STORAGE_ADAPTER: ${BACKUP_STORAGE_ADAPTER:-noop}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://storage.yandexcloud.net}
      S3_REGION: ${S3_REGION:-ru-central1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-palomnik-backups}
      BACKUP_LAST_PATH: ${BACKUP_LAST_PATH:-/tmp/palomnik-last-backup.json}
      MESSENGER_ADAPTER: ${MESSENGER_ADAPTER:-noop}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_BASE: ${WHATSAPP_GRAPH_BASE:-https://graph.facebook.com/v21.0}
      PUBLISHER_ADAPTER: ${PUBLISHER_ADAPTER:-noop}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      VK_WALL_TOKEN: ${VK_WALL_TOKEN:-}
      VK_WALL_OWNER_ID: ${VK_WALL_OWNER_ID:-}
      VK_API_BASE: ${VK_API_BASE:-https://api.vk.com}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_API_BASE: ${MAX_API_BASE:-https://platform-api2.max.ru}
      MAX_FEED_CHAT_ID: ${MAX_FEED_CHAT_ID:-}
      AI_ADAPTER: ${AI_ADAPTER:-noop}
      YANDEXGPT_API_KEY: ${YANDEXGPT_API_KEY:-}
      YANDEXGPT_FOLDER_ID: ${YANDEXGPT_FOLDER_ID:-}
      YANDEXGPT_MODEL: ${YANDEXGPT_MODEL:-yandexgpt-lite}
      YANDEXGPT_API_BASE: ${YANDEXGPT_API_BASE:-https://llm.api.cloud.yandex.net}
      PAYMENT_ADAPTER: ${PAYMENT_ADAPTER:-noop}
      SBER_USERNAME: ${SBER_USERNAME:-}
      SBER_PASSWORD: ${SBER_PASSWORD:-}
      SBER_API_BASE: ${SBER_API_BASE:-https://securepayments.sberbank.ru}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_API_BASE: ${YOOKASSA_API_BASE:-https://api.yookassa.ru}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-}
    volumes:
      - uploads_data:/data/uploads
    ports: !override []
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SITE_NAME: "${NEXT_PUBLIC_SITE_NAME:-Под Покровом Божией Матери \"Тихвинская\"}"
        NEXT_PUBLIC_SITE_FULL_NAME: "${NEXT_PUBLIC_SITE_FULL_NAME:-РПЦ Тихвинская Епархия. Паломническая служба «Под покровом Божией Матери «Тихвинская»»}"
        NEXT_PUBLIC_SITE_TAGLINE: "${NEXT_PUBLIC_SITE_TAGLINE:-Паломническая служба}"
        NEXT_PUBLIC_SITE_DESCRIPTION: "${NEXT_PUBLIC_SITE_DESCRIPTION:-Паломнические поездки в монастыри и святые места России. Сопровождение духовника, комфортный транспорт, прозрачная стоимость.}"
        NEXT_PUBLIC_CONTACT_PHONE: "${NEXT_PUBLIC_CONTACT_PHONE:-+79669334321}"
        NEXT_PUBLIC_CONTACT_PHONE_DISPLAY: "${NEXT_PUBLIC_CONTACT_PHONE_DISPLAY:-+7 966 933-43-21}"
        NEXT_PUBLIC_CONTACT_EMAIL: "${NEXT_PUBLIC_CONTACT_EMAIL:-info@tikhvin-palomnik.ru}"
        NEXT_PUBLIC_YM_ID: ${NEXT_PUBLIC_YM_ID:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_YANDEX_VERIFICATION: ${NEXT_PUBLIC_YANDEX_VERIFICATION:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    environment:
      API_INTERNAL_URL: http://api:8080/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_OAUTH_CLIENT_ID: ${YANDEX_OAUTH_CLIENT_ID:-}
      YANDEX_OAUTH_CLIENT_SECRET: ${YANDEX_OAUTH_CLIENT_SECRET:-}
      VK_OAUTH_CLIENT_ID: ${VK_OAUTH_CLIENT_ID:-}
      VK_OAUTH_CLIENT_SECRET: ${VK_OAUTH_CLIENT_SECRET:-}
      MAX_OAUTH_CLIENT_ID: ${MAX_OAUTH_CLIENT_ID:-}
      MAX_OAUTH_CLIENT_SECRET: ${MAX_OAUTH_CLIENT_SECRET:-}
      MAX_OAUTH_AUTHORIZE_URL: ${MAX_OAUTH_AUTHORIZE_URL:-}
      MAX_OAUTH_TOKEN_URL: ${MAX_OAUTH_TOKEN_URL:-}
      MAX_OAUTH_USERINFO_URL: ${MAX_OAUTH_USERINFO_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_LOGIN_BOT_TOKEN: ${TELEGRAM_LOGIN_BOT_TOKEN:-}
      TELEGRAM_LOGIN_BOT_USERNAME: ${TELEGRAM_LOGIN_BOT_USERNAME:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://tikhvin-palomnik.ru}
    ports: !override []
    restart: unless-stopped

  worker:
    depends_on: !override
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-palomnik}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-palomnik}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      NOTIFICATION_ADAPTER: ${NOTIFICATION_ADAPTER:-noop}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      MANAGEMENT_BASE_URL: ${MANAGEMENT_BASE_URL:-https://tikhvin-palomnik.ru/management/bookings}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
